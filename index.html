<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Image Analyzer Pro</title>
  <style>
    :root {
      --medical-blue: #2c3e50;
      --clinical-teal: #1abc9c;
      --dark-bg: #121212;
      --white: #ffffff;
      --warning: #f39c12;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: var(--dark-bg);
      color: var(--white);
      margin: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center;
    }

    .header-banner {
      width: 100%; background-color: var(--medical-blue);
      padding: 30px 0; text-align: center; border-bottom: 4px solid var(--clinical-teal);
    }

    .container {
      max-width: 1100px; width: 90%; background: rgba(255, 255, 255, 0.05);
      padding: 30px; border-radius: 12px; margin: 30px 0;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    #recommendation-box {
      background-color: #2980b9; color: white; padding: 20px;
      border-radius: 8px; margin-bottom: 25px; text-align: left;
      display: none; border-left: 10px solid var(--clinical-teal);
    }

    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .image-card { background: #000; border: 1px solid #444; border-radius: 8px; overflow: hidden; }
    .image-card label { display: block; padding: 8px; background: #333; font-size: 0.8rem; font-weight: bold; color: var(--clinical-teal); }

    img, canvas { width: 100%; display: block; image-rendering: pixelated; }

    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .slider-group { margin-bottom: 18px; text-align: left; }
    .slider-group label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
    .slider-group span { color: var(--clinical-teal); font-weight: bold; }

    input[type="range"] { width: 100%; accent-color: var(--clinical-teal); cursor: pointer; }

    .button-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; padding-top: 20px; border-top: 1px solid #444; grid-column: span 2; }
    button { padding: 12px 20px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
    
    .btn-filter { background: #34495e; color: white; }
    .btn-filter:hover { background: var(--clinical-teal); }
    .btn-main { background: var(--clinical-teal); color: white; width: 100%; margin-top: 10px; font-size: 1.1rem; }

    #filter-description {
      background: rgba(0,0,0,0.4); padding: 15px; border-radius: 6px;
      margin-top: 20px; display: none; text-align: left; border: 1px solid #555; grid-column: span 2;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="header-banner">
  <h1>Diagnostic Image Enhancer</h1>
  <p>ระบบประมวลผลภาพทางการแพทย์ความละเอียดสูง (Clinical Grade)</p>
</div>

<div class="container">
  
  <div class="upload-zone" style="border: 2px dashed var(--clinical-teal); padding: 20px; border-radius: 8px; margin-bottom: 30px; text-align: center;">
    <input type="file" id="upload" accept="image/*">
    <p style="font-size: 0.8rem; opacity: 0.6;">รองรับไฟล์ DICOM Export (JPG/PNG), X-ray, Ultrasound</p>
  </div>

  <div id="recommendation-box">
    <strong>🔬 Clinical Advice & Rationale:</strong>
    <p id="recommendation-text" style="margin: 8px 0 0 0; font-size: 0.95rem; line-height: 1.6;"></p>
  </div>

  <div class="preview-grid">
    <div class="image-card"><label>INPUT SCAN</label><img id="before-img"></div>
    <div class="image-card"><label>PROCESSED VIEW</label><img id="main-img" class="hidden"></div>
  </div>

  <div id="editor-ui" class="hidden">
    <div class="editor-grid">
      <div class="slider-group">
        <label>Brightness (Window Level) <span id="v-bright">100%</span></label>
        <input type="range" id="bright" min="0" max="250" value="100">
      </div>
      <div class="slider-group">
        <label>Contrast (Window Width) <span id="v-contrast">100%</span></label>
        <input type="range" id="contrast" min="0" max="250" value="100">
      </div>
      <div class="slider-group">
        <label>Smoothing (Tissue De-noise) <span id="v-smooth">0px</span></label>
        <input type="range" id="smooth" min="0" max="10" value="0">
      </div>
      <div class="slider-group">
        <label>Edge Definition <span id="v-sharp">0%</span></label>
        <input type="range" id="sharp" min="0" max="100" value="0">
      </div>

      <div class="button-group">
        <button class="btn-filter" onclick="setFilter('median')">Denoise (ลดสัญญาณรบกวน)</button>
        <button class="btn-filter" onclick="setFilter('wiener')">Bone/Edge Enhance (เน้นขอบ)</button>
        <button class="btn-filter" onclick="setFilter('mean')">Soft Tissue (เน้นเนื้อเยื่อ)</button>
        <button class="btn-filter" style="margin-left: auto; background: #c0392b;" onclick="resetAll()">Reset</button>
        <button class="btn-main" onclick="showFinal()">GENERATE DIAGNOSTIC OUTPUT</button>
      </div>

      <div id="filter-description">
        <strong>📋 เทคนิคการปรับปรุงภาพ:</strong>
        <p id="filter-description-text" style="margin-top: 8px; color: #bdc3c7; font-size: 0.9rem;"></p>
      </div>
    </div>
  </div>

  <div id="result-ui" class="hidden">
    <canvas id="after-canvas"></canvas>
    <div class="button-group" style="justify-content: center; border: none;">
      <button class="btn-main" style="width: auto; padding: 15px 40px;" onclick="downloadImage()">💾 SAVE PROCESSED SCAN</button>
      <button class="btn-filter" onclick="goBack()">BACK TO ANALYZER</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const upload = document.getElementById('upload'), mainImg = document.getElementById('main-img');
  const brightness = document.getElementById('bright'), contrast = document.getElementById('contrast');
  const sharp = document.getElementById('sharp'), smooth = document.getElementById('smooth');
  const recBox = document.getElementById('recommendation-box'), recText = document.getElementById('recommendation-text');
  const filterDescBox = document.getElementById('filter-description'), filterDescText = document.getElementById('filter-description-text');

  let currentFilter = 'none', originalSrc = '', fileExtension = 'image/png';

  upload.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      fileExtension = file.type;
      const reader = new FileReader();
      reader.onload = (event) => {
        originalSrc = event.target.result;
        mainImg.src = originalSrc;
        document.getElementById('before-img').src = originalSrc;
        mainImg.classList.remove('hidden');
        document.getElementById('editor-ui').classList.remove('hidden');
        generateMedicalRecommendation();
        resetAll();
      }
      reader.readAsDataURL(file);
    }
  });

  function generateMedicalRecommendation() {
    recBox.style.display = "block";
    const medicalTips = [
      "<b>หลักการปรับแสง (Windowing):</b> หากต้องการดูรายละเอียดกระดูก ให้เพิ่ม Contrast สูง (140%+) เพื่อแยกความหนาแน่น แต่ถ้าต้องการดูเนื้อเยื่ออ่อน ให้เน้นเพิ่ม Brightness ร่วมกับ Smoothing (2-3px) เพื่อลดสัญญาณรบกวน",
      "<b>การปรับเพื่อวินิจฉัย:</b> การเพิ่ม Contrast มากเกินไปอาจทำให้เกิด 'Image Artifact' หรือจุดหลอกตา แนะนำให้ปรับ Contrast คู่กับ Brightness โดยรักษาสมดุลไม่ให้พิกเซลส่วนสว่างกลายเป็นสีขาวล้วน",
      "<b>คำแนะนำสำหรับภาพ Ultrasound:</b> มักมี Speckle Noise สูง ควรใช้ <b>Smoothing</b> ที่ระดับ 2-4px ร่วมกับฟิลเตอร์ <b>Denoise</b> เพื่อให้เห็นขอบเขตของอวัยวะได้ชัดเจนขึ้น",
      "<b>สำหรับการหาจุดแตกหัก (Fracture):</b> แนะนำให้ลด Smoothing เป็น 0px และเพิ่ม Edge Definition เป็น 30% เพื่อรักษาความคมชัดของรอยร้าวเล็กๆ ไว้"
    ];
    recText.innerHTML = medicalTips[Math.floor(Math.random() * medicalTips.length)];
  }

  window.setFilter = function(f) {
    currentFilter = f;
    filterDescBox.style.display = "block";
    let rationale = "";
    switch(f) {
      case 'median': 
        rationale = "<b>Denoise:</b> ใช้ Median Algorithm เพื่อกำจัดจุดบอดสี (Outliers) ในภาพสแกน ช่วยให้พื้นผิวเนื้อเยื่อดูเรียบเนียนโดยไม่ทำลายขอบโครงสร้างสำคัญ"; break;
      case 'wiener': 
        rationale = "<b>Edge Enhance:</b> เพิ่มความคมชัดในระดับพิกเซล เหมาะสำหรับเน้นรอยโรคที่มีขอบเขตชัดเจน เช่น ถุงน้ำ หรือรอยร้าวของกระดูก"; break;
      case 'mean': 
        rationale = "<b>Tissue Smooth:</b> ใช้การเฉลี่ยค่าสีพิกเซลรอบข้าง เหมาะสำหรับภาพที่มีความเปรียบต่างสูงเกินไป ช่วยให้การไล่ระดับเฉดเทา (Gray Scale) ดูเป็นธรรมชาติ"; break;
    }
    filterDescText.innerHTML = rationale;
    updateStyles();
  }

  function updateStyles() {
    const sVal = parseInt(sharp.value);
    const smVal = parseInt(smooth.value);
    
    // การปรับภาพทางการแพทย์: บังคับ Grayscale และเน้น Contrast
    let filterStr = `brightness(${brightness.value}%) contrast(${contrast.value}%) blur(${smVal}px) contrast(${100 + (sVal * 0.5)}%) grayscale(100%) `;

    if(currentFilter === 'median') filterStr += ' contrast(1.1)';
    else if(currentFilter === 'wiener') filterStr += ' contrast(1.4) brightness(1.05)';
    else if(currentFilter === 'mean') filterStr += ' opacity(0.95)';

    mainImg.style.filter = filterStr;
    document.getElementById('v-bright').innerText = brightness.value + '%';
    document.getElementById('v-contrast').innerText = contrast.value + '%';
    document.getElementById('v-smooth').innerText = smVal + 'px';
    document.getElementById('v-sharp').innerText = sVal + '%';
  }

  window.resetAll = () => {
    brightness.value = 100; contrast.value = 100; sharp.value = 0; smooth.value = 0;
    currentFilter = 'none'; filterDescBox.style.display = "none";
    updateStyles();
  }

  window.showFinal = function() {
    document.getElementById('editor-ui').classList.add('hidden');
    document.getElementById('result-ui').classList.remove('hidden');
    const canvas = document.getElementById('after-canvas'), ctx = canvas.getContext('2d'), img = new Image();
    img.src = originalSrc;
    img.onload = function() {
      canvas.width = img.width; canvas.height = img.height;
      ctx.imageSmoothingEnabled = false; // ป้องกันพิกเซลเพี้ยน
      ctx.filter = mainImg.style.filter;
      ctx.drawImage(img, 0, 0);
    }
  }

  window.goBack = () => {
    document.getElementById('editor-ui').classList.remove('hidden');
    document.getElementById('result-ui').classList.add('hidden');
  }

  window.downloadImage = () => {
    const canvas = document.getElementById('after-canvas'), link = document.createElement('a');
    link.download = 'clinical_processed_image.png';
    link.href = canvas.toDataURL(fileExtension, 1.0);
    link.click();
  }

  brightness.addEventListener('input', updateStyles);
  contrast.addEventListener('input', updateStyles);
  sharp.addEventListener('input', updateStyles);
  smooth.addEventListener('input', updateStyles);
});
</script>
</body>
</html>
