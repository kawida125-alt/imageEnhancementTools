<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Influenca Style - Image Enhancement</title>
  <style>
    :root {
      --primary-color: #8ca8a8; /* สีเขียวตามภาพเรฟ */
      --dark-text: #334747;
      --light-bg: #f4f7f7;
      --white: #ffffff;
      --accent: #5d7575;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--light-bg);
      color: var(--dark-text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header Section ตามภาพเรฟ */
    .header-banner {
      width: 100%;
      background-color: var(--white);
      padding: 60px 0;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 40px;
    }

    .header-banner h1 {
      font-size: 3rem;
      margin: 0;
      font-weight: 800;
      color: var(--dark-text);
    }

    .header-banner p {
      color: #777;
      max-width: 600px;
      margin: 15px auto;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      width: 90%;
      background: var(--white);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      margin-bottom: 50px;
    }

    /* Upload Zone */
    .upload-zone {
      background: #fafafa;
      border: 2px dashed var(--primary-color);
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 30px;
      transition: 0.3s;
    }

    /* Recommendation Box - ส่วนที่ขอเพิ่ม */
    #recommendation-box {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 30px;
      text-align: left;
      display: none; /* ซ่อนไว้ก่อนอัปโหลด */
      animation: fadeIn 0.5s ease;
    }

    /* Image Display Area */
    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    .image-card {
      background: var(--white);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.03);
    }

    .image-card label {
      display: block;
      padding: 10px;
      background: #f0f3f3;
      font-weight: bold;
      font-size: 0.9rem;
    }

    img, canvas {
      width: 100%;
      display: block;
      background: #eee;
    }

    /* Editor UI */
    .editor-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      text-align: left;
    }

    .slider-group {
      margin-bottom: 20px;
    }

    .slider-group label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary-color);
    }

    /* Buttons */
    .button-group {
      grid-column: span 2;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    button {
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-filter { background: #e8eeee; color: var(--dark-text); }
    .btn-filter:hover { background: var(--primary-color); color: white; }
    
    .btn-main { background: var(--dark-text); color: white; }
    .btn-main:hover { background: var(--primary-color); }

    .hidden { display: none; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      .preview-grid, .editor-section { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="header-banner">
  <h1>Image Enhance</h1>
  <p>ปรับแต่งรูปภาพของคุณให้สวยงามด้วยระบบฟิลเตอร์อัจฉริยะ ออกแบบมาเพื่อความเรียบง่ายและใช้งานได้จริง</p>
</div>

<div class="container">
  
  <div class="upload-zone">
    <input type="file" id="upload" accept="image/*">
    <p id="empty-state">กรุณาเลือกไฟล์ภาพเพื่อเริ่มต้น</p>
  </div>

  <div id="recommendation-box">
    <strong>💡 AI Recommendation:</strong>
    <p id="recommendation-text" style="margin: 5px 0 0 0;"></p>
  </div>

  <div class="preview-grid">
    <div class="image-card">
      <label>Original Image</label>
      <img id="before-img">
    </div>
    <div class="image-card">
      <label>Live Preview</label>
      <img id="main-img" class="hidden">
    </div>
  </div>

  <div id="editor-ui" class="hidden">
    <div class="editor-section">
      <div class="slider-group">
        <label>Brightness <span id="v-bright">100%</span></label>
        <input type="range" id="bright" min="0" max="200" value="100">
      </div>
      <div class="slider-group">
        <label>Contrast <span id="v-contrast">100%</span></label>
        <input type="range" id="contrast" min="0" max="200" value="100">
      </div>
      <div class="slider-group">
        <label>Smooth <span id="v-smooth">0px</span></label>
        <input type="range" id="smooth" min="0" max="10" value="0">
      </div>
      <div class="slider-group">
        <label>Sharpness <span id="v-sharp">0%</span></label>
        <input type="range" id="sharp" min="0" max="100" value="0">
      </div>

      <div class="button-group">
        <button class="btn-filter" onclick="setFilter('mean')">Mean Filter</button>
        <button class="btn-filter" onclick="setFilter('median')">Median Filter</button>
        <button class="btn-filter" onclick="setFilter('gaussian')">Gaussian</button>
        <button class="btn-filter" onclick="setFilter('wiener')">Wiener Style</button>
        <button class="btn-filter" style="margin-left: auto;" onclick="resetAll()">Reset</button>
        <button class="btn-main" onclick="showFinal()">Apply & Save</button>
      </div>
    </div>
  </div>

  <div id="result-ui" class="hidden">
    <h3>ภาพที่ประมวลผลเสร็จสิ้น</h3>
    <canvas id="after-canvas" style="border-radius: 15px; margin-bottom: 20px;"></canvas>
    <div class="button-group" style="justify-content: center; border: none;">
      <button class="btn-main" onclick="downloadImage()">Download Image</button>
      <button class="btn-filter" onclick="goBack()">Back to Edit</button>
    </div>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const upload = document.getElementById('upload');
  const mainImg = document.getElementById('main-img');
  const emptyState = document.getElementById('empty-state');
  const brightness = document.getElementById('bright');
  const contrast = document.getElementById('contrast');
  const smooth = document.getElementById('smooth');
  const sharp = document.getElementById('sharp');
  const recBox = document.getElementById('recommendation-box');
  const recText = document.getElementById('recommendation-text');

  let currentFilter = 'none';
  let originalSrc = '';
  let fileExtension = 'image/png';

  upload.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      fileExtension = file.type;
      const reader = new FileReader();
      reader.onload = function(event) {
        originalSrc = event.target.result;
        mainImg.src = originalSrc;
        document.getElementById('before-img').src = originalSrc;
        
        mainImg.classList.remove('hidden');
        emptyState.classList.add('hidden');
        document.getElementById('editor-ui').classList.remove('hidden');
        
        // เมื่อโหลดรูปเสร็จ ให้รันระบบแนะนำ
        generateRecommendation(file);
        resetAll();
      }
      reader.readAsDataURL(file);
    }
  });

  // ฟังก์ชันสุ่มหรือประเมินเพื่อแนะนำ Filter
  function generateRecommendation(file) {
    recBox.style.display = "block";
    
    // Logic จำลองการวิเคราะห์:
    // ในความเป็นจริงต้องใช้ Canvas วิเคราะห์ Pixel แต่เบื้องต้นเราใช้ชื่อไฟล์หรือขนาดไฟล์จำลองได้
    const hints = [
      "ภาพดูเหมือนจะมี Noise ลองใช้ 'Median Filter' เพื่อเกลี่ยผิวให้เนียนขึ้น",
      "เพื่อความคมชัดที่มากขึ้น แนะนำให้ปรับ 'Sharpness' ไปที่ 20% และใช้ 'Wiener Style'",
      "ภาพอาจจะมืดไปนิด ลองเพิ่ม 'Brightness' เป็น 110% และใช้ 'Gaussian' เพื่อความนุ่มนวล",
      "ลองใช้ 'Mean Filter' หากคุณต้องการลดรายละเอียดส่วนเกินของภาพ"
    ];
    
    const randomHint = hints[Math.floor(Math.random() * hints.length)];
    recText.innerText = randomHint;
  }

  function updateStyles() {
    const sh = sharp.value / 20;
    let filterStr = `brightness(${brightness.value}%) contrast(${contrast.value}%) blur(${smooth.value}px) grayscale(${sh * 10}%) contrast(${100 + parseInt(sharp.value)}%) `;

    if(currentFilter === 'mean') filterStr += ' opacity(0.9) blur(0.5px)';
    if(currentFilter === 'median') filterStr += ' saturate(0.8) contrast(1.1)';
    if(currentFilter === 'gaussian') filterStr += ' blur(1px)';
    if(currentFilter === 'wiener') filterStr += ' contrast(1.2) brightness(1.1) saturate(0)';

    mainImg.style.filter = filterStr;

    document.getElementById('v-bright').innerText = brightness.value + '%';
    document.getElementById('v-contrast').innerText = contrast.value + '%';
    document.getElementById('v-smooth').innerText = smooth.value + 'px';
    document.getElementById('v-sharp').innerText = sharp.value + '%';
  }

  // --- Logic ส่วนที่เหลือ (เหมือนเดิมตามที่คุณต้องการเป๊ะๆ) ---
  brightness.addEventListener('input', updateStyles);
  contrast.addEventListener('input', updateStyles);
  smooth.addEventListener('input', updateStyles);
  sharp.addEventListener('input', updateStyles);

  window.setFilter = function(f) {
    currentFilter = f;
    updateStyles();
  }

  window.resetAll = function() {
    brightness.value = 100;
    contrast.value = 100;
    smooth.value = 0;
    sharp.value = 0;
    currentFilter = 'none';
    updateStyles();
  }

  window.showFinal = function() {
    document.getElementById('editor-ui').classList.add('hidden');
    document.getElementById('result-ui').classList.remove('hidden');
    const canvas = document.getElementById('after-canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = mainImg.src;
    img.onload = function() {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.filter = mainImg.style.filter;
      ctx.drawImage(img, 0, 0);
    }
  }

  window.goBack = function() {
    document.getElementById('editor-ui').classList.remove('hidden');
    document.getElementById('result-ui').classList.add('hidden');
  }

  window.downloadImage = function() {
    const canvas = document.getElementById('after-canvas');
    const link = document.createElement('a');
    link.download = 'enhanced-image.png';
    link.href = canvas.toDataURL(fileExtension);
    link.click();
  }
});
</script>

</body>
</html>
