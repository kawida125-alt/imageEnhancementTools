<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Sharper - Image Enhancement</title>
  <style>
    /* ... (CSS ส่วนใหญ่คงเดิม แต่ปรับปรุงส่วน Canvas) ... */
    :root {
      --primary-color: #8ca8a8;
      --dark-text: #ffffff;
      --dark-bg: #334747;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--dark-bg);
      color: var(--dark-text);
      margin: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center;
    }

    .header-banner {
      width: 100%; background-color: rgba(255, 255, 255, 0.1);
      padding: 40px 0; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .container {
      max-width: 1100px; width: 90%; background: rgba(255, 255, 255, 0.05);
      padding: 40px; border-radius: 20px; margin: 40px 0;
    }

    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
    .image-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; color: #334747; }
    .image-card label { display: block; padding: 10px; background: #f0f3f3; font-weight: bold; }

    img, canvas { width: 100%; display: block; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; }

    /* ปรับแต่ง Slider */
    .slider-group { margin-bottom: 20px; text-align: left; }
    input[type="range"] { width: 100%; accent-color: var(--primary-color); }

    .button-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    button { padding: 12px 24px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; }
    .btn-filter { background: rgba(255, 255, 255, 0.1); color: white; }
    .btn-main { background: var(--primary-color); color: white; }
    
    #recommendation-box { background: var(--primary-color); padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; display: none; }
    #filter-description { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; margin-top: 20px; display: none; text-align: left; border: 1px solid var(--primary-color); }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="header-banner">
  <h1>Image Enhance Pro</h1>
  <p>ยกระดับความชัดเจนของภาพด้วยเทคนิค High-Pass Sharpening</p>
</div>

<div class="container">
  <div class="upload-zone" style="border: 2px dashed var(--primary-color); padding: 30px; border-radius: 15px; margin-bottom: 30px;">
    <input type="file" id="upload" accept="image/*">
  </div>

  <div id="recommendation-box">
    <strong>💡 ✨ คำแนะนำการปรับแต่ง:</strong>
    <p id="recommendation-text"></p>
  </div>

  <div class="preview-grid">
    <div class="image-card"><label>Original</label><img id="before-img"></div>
    <div class="image-card"><label>Live Preview</label><img id="main-img" class="hidden"></div>
  </div>

  <div id="editor-ui" class="hidden">
    <div class="slider-group">
      <label>Brightness <span id="v-bright">100%</span></label>
      <input type="range" id="bright" min="0" max="200" value="100">
    </div>
    <div class="slider-group">
      <label>Contrast <span id="v-contrast">100%</span></label>
      <input type="range" id="contrast" min="0" max="200" value="100">
    </div>
    <div class="slider-group">
      <label>Sharpness (ขอบชัด) <span id="v-sharp">0%</span></label>
      <input type="range" id="sharp" min="0" max="100" value="0">
    </div>

    <div class="button-group">
      <button class="btn-filter" onclick="setFilter('mean')">Mean (นุ่มนวล)</button>
      <button class="btn-filter" onclick="setFilter('median')">Median (ลดนอยซ์)</button>
      <button class="btn-filter" onclick="setFilter('wiener')">Wiener (คมชัดพิเศษ)</button>
      <button class="btn-filter" style="margin-left: auto;" onclick="resetAll()">Reset</button>
      <button class="btn-main" onclick="showFinal()">Apply & Save</button>
    </div>

    <div id="filter-description">
      <strong>🔍 รายละเอียด Filter:</strong>
      <p id="filter-description-text"></p>
    </div>
  </div>

  <div id="result-ui" class="hidden">
    <canvas id="after-canvas"></canvas>
    <div class="button-group" style="justify-content: center;">
      <button class="btn-main" onclick="downloadImage()">Download Image</button>
      <button class="btn-filter" onclick="goBack()">Back</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const upload = document.getElementById('upload'), mainImg = document.getElementById('main-img');
  const brightness = document.getElementById('bright'), contrast = document.getElementById('contrast');
  const sharp = document.getElementById('sharp');
  const recBox = document.getElementById('recommendation-box'), recText = document.getElementById('recommendation-text');
  
  let currentFilter = 'none', originalSrc = '', fileExtension = 'image/png';

  upload.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      fileExtension = file.type;
      const reader = new FileReader();
      reader.onload = (event) => {
        originalSrc = event.target.result;
        mainImg.src = originalSrc;
        document.getElementById('before-img').src = originalSrc;
        mainImg.classList.remove('hidden');
        document.getElementById('editor-ui').classList.remove('hidden');
        recBox.style.display = "block";
        recText.innerText = "เพื่อภาพที่ชัดที่สุด: ให้เพิ่ม Contrast ไปที่ 120% และ Sharpness ที่ 30% จากนั้นใช้ Wiener Style";
        resetAll();
      }
      reader.readAsDataURL(file);
    }
  });

  function updateStyles() {
    // เทคนิคความชัด: ใช้ Contrast ซ้อนกัน 2 รอบเพื่อดึงขอบภาพ (Edge Enhancement)
    const sharpVal = parseInt(sharp.value);
    const extraContrast = 100 + (sharpVal * 0.5);
    
    let filterStr = `brightness(${brightness.value}%) contrast(${contrast.value}%) contrast(${extraContrast}%) saturate(1.05) `;

    if(currentFilter === 'mean') filterStr += ' blur(0.4px)';
    else if(currentFilter === 'median') filterStr += ' contrast(1.1)';
    else if(currentFilter === 'wiener') filterStr += ' contrast(1.3) brightness(1.05) saturate(1.1)';

    mainImg.style.filter = filterStr;
    document.getElementById('v-bright').innerText = brightness.value + '%';
    document.getElementById('v-contrast').innerText = contrast.value + '%';
    document.getElementById('v-sharp').innerText = sharp.value + '%';
  }

  window.setFilter = function(f) {
    currentFilter = f;
    document.getElementById('filter-description').style.display = "block";
    document.getElementById('filter-description-text').innerText = f === 'wiener' ? "Wiener: ปรับสมดุลแสงและเพิ่มความเข้มข้นของขอบภาพให้ชัดเจนที่สุด" : "ฟิลเตอร์นี้จะเกลี่ยภาพให้นุ่มนวลขึ้น";
    updateStyles();
  }

  window.resetAll = () => {
    brightness.value = 100; contrast.value = 100; sharp.value = 0;
    currentFilter = 'none'; updateStyles();
  }

  window.showFinal = function() {
    document.getElementById('editor-ui').classList.add('hidden');
    document.getElementById('result-ui').classList.remove('hidden');
    
    const canvas = document.getElementById('after-canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = originalSrc;
    
    img.onload = function() {
      // หัวใจสำคัญ: วาดตามขนาดจริงของภาพ ไม่ใช่ขนาดที่โชว์บนหน้าจอ
      canvas.width = img.width;
      canvas.height = img.height;
      
      // ใช้ Smoothing คุณภาพสูง
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      
      ctx.filter = mainImg.style.filter;
      ctx.drawImage(img, 0, 0, img.width, img.height);
    }
  }

  window.downloadImage = () => {
    const link = document.createElement('a');
    link.download = 'high-res-enhanced.png';
    link.href = document.getElementById('after-canvas').toDataURL(fileExtension, 1.0);
    link.click();
  }

  brightness.addEventListener('input', updateStyles);
  contrast.addEventListener('input', updateStyles);
  sharp.addEventListener('input', updateStyles);
});
</script>
</body>
</html>
