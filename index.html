<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic Image Enhancer</title>
  <style>
    :root {
      --primary: #769b9b;       /* สีเขียวตุ่น Sage Green แบบในภาพ */
      --primary-dark: #587a7a;
      --secondary: #4a6363;     /* สีเขียวเข้มสำหรับ Footer/Text */
      --accent-dark: #2a3a3a;   /* สีปุ่มเข้ม */
      --bg-light: #eef3f3;      /* สีพื้นหลังรวมแบบสว่าง */
      --card-bg: #ffffff;       /* สีพื้นหลังการ์ด */
      --input-bg: #dce5e5;      /* สีพื้นหลังกล่องอัปโหลด */
      --danger: #e74c3c;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-light);
      color: var(--secondary);
      margin: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }

    /* --- Header Section (สไตล์ Influenca) --- */
    .header-banner {
      width: 100%;
      background-color: var(--bg-light);
      padding: 80px 20px 40px 20px;
      text-align: center;
    }

    .header-banner h1 {
      font-size: 3.5rem;
      margin: 0 0 10px 0;
      font-weight: 900;
      color: #111;
      position: relative;
      display: inline-block;
    }

    /* เส้นหยักใต้หัวข้อ */
    .header-banner h1::after {
      content: '〰〰〰';
      display: block;
      font-size: 1.5rem;
      color: var(--secondary);
      margin-top: -5px;
      letter-spacing: -2px;
      opacity: 0.7;
    }

    .header-banner p {
      color: #666;
      max-width: 600px;
      margin: 15px auto;
      line-height: 1.6;
      font-size: 1.1rem;
    }

    /* --- Container & Cards --- */
    .container {
      max-width: 1000px; width: 92%;
      margin-bottom: 80px;
      flex: 1;
    }

    /* Upload Zone (สไตล์ช่อง Form ในภาพ) */
    .upload-zone {
      background-color: var(--input-bg);
      padding: 40px;
      border-radius: 20px;
      margin-bottom: 40px;
      text-align: center;
      border: 2px dashed rgba(74, 99, 99, 0.3);
      transition: 0.3s;
    }
    
    .upload-zone p {
      color: var(--secondary);
      font-weight: 700;
      margin-top: 0; margin-bottom: 20px;
    }

    .upload-zone input[type="file"] {
      background: var(--white);
      padding: 12px 20px;
      border-radius: 30px;
      color: var(--secondary);
