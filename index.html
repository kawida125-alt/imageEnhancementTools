<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Influenca Pro - Smart Image Enhancement</title>
  <style>
    :root {
      --primary-color: #8ca8a8;
      --dark-bg: #2a3b3b; /* พื้นหลังเข้มขึ้นกว่าเดิม 1 ระดับ */
      --card-bg: #ffffff;
      --white: #ffffff;
      --accent: #5d7575;
    }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--dark-bg);
      color: var(--white);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-banner {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 50px 0;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
    }

    .header-banner h1 { font-size: 2.8rem; margin: 0; font-weight: 800; }

    .container {
      max-width: 1000px;
      width: 90%;
      background: rgba(255, 255, 255, 0.07);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      margin-bottom: 50px;
    }

    /* Recommendation Box */
    #recommendation-box {
      background-color: var(--primary-color);
      color: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 30px;
      text-align: left;
      display: none;
      animation: fadeIn 0.5s ease;
      border-left: 8px solid var(--accent);
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-bottom: 30px;
    }

    .image-card {
      background: var(--card-bg);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .image-card label {
      display: block;
      padding: 10px;
      background: #f0f3f3;
      font-weight: bold;
      color: #334747;
      font-size: 0.9rem;
    }

    img, canvas {
      width: 100%;
      display: block;
      background: #111;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Editor Section */
    .slider-group { margin-bottom: 20px; text-align: left; }
    .slider-group label { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
    
    input[type="range"] {
      width: 100%;
      accent-color: var(--primary-color);
      height: 6px;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    button {
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-filter { background: rgba(255, 255, 255, 0.15); color: white; }
    .btn-filter:hover { background: var(--primary-color); }
    .btn-main { background: var(--primary-color); color: white; }
    .btn-main:hover { transform: translateY(-2px); filter: brightness(1.1); }

    #filter-description {
      background: rgba(0, 0, 0, 0.25);
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
      display: none;
      text-align: left;
      border: 1px solid var(--primary-color);
      line-height: 1.5;
    }

    .hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) { .preview-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="header-banner">
  <h1>Image Enhance</h1>
  <p>ยกระดับภาพของคุณด้วยระบบวิเคราะห์ฟิลเตอร์ตามลักษณะภาพ</p>
</div>

<div class="container">
  
  <div class="upload-zone" style="border: 2px dashed var(--primary-color); padding: 30px; border-radius: 20px; margin-bottom: 30px; text-align: center; background: rgba(255,255,255,0.03);">
    <input type="file" id="upload" accept="image/*">
    <p style="margin-top: 10px; opacity: 0.6;">รองรับไฟล์ JPG, PNG (แนะนำภาพที่ต้องการความคมชัด)</p>
  </div>

  <div id="recommendation-box">
    <strong>💡 ✨ การวิเคราะห์ภาพจากระบบ:</strong>
    <p id="recommendation-text" style="margin: 8px 0 0 0;"></p>
  </div>

  <div class="preview-grid">
    <div class="image-card"><label>Original</label><img id="before-img"></div>
    <div class="image-card"><label>Live Preview</label><img id="main-img" class="hidden"></div>
  </div>

  <div id="editor-ui" class="hidden">
    <div class="slider-group">
      <label>Brightness <span id="v-bright">100%</span></label>
      <input type="range" id="bright" min="0" max="200" value="100">
    </div>
    <div class="slider-group">
      <label>Contrast <span id="v-contrast">100%</span></label>
      <input type="range" id="contrast" min="0" max="200" value="100">
    </div>
    <div class="slider-group">
      <label>Sharpness (ขอบชัด) <span id="v-sharp">0%</span></label>
      <input type="range" id="sharp" min="0" max="100" value="0">
    </div>

    <div class="button-group">
      <button class="btn-filter" onclick="setFilter('mean')">Mean</button>
      <button class="btn-filter" onclick="setFilter('median')">Median</button>
      <button class="btn-filter" onclick="setFilter('gaussian')">Gaussian</button>
      <button class="btn-filter" onclick="setFilter('wiener')">Wiener</button>
      <button class="btn-filter" style="margin-left: auto;" onclick="resetAll()">ล้างค่า</button>
      <button class="btn-main" onclick="showFinal()">ประมวลผลและบันทึก</button>
    </div>

    <div id="filter-description">
      <strong>🔍 ทำไมเราถึงแนะนำฟิลเตอร์นี้:</strong>
      <p id="filter-description-text" style="margin-top: 8px; color: #d1d8d8;"></p>
    </div>
  </div>

  <div id="result-ui" class="hidden">
    <canvas id="after-canvas" style="border-radius: 15px; margin-bottom: 25px;"></canvas>
    <div class="button-group" style="justify-content: center; border: none;">
      <button class="btn-main" onclick="downloadImage()">ดาวน์โหลดภาพความละเอียดสูง</button>
      <button class="btn-filter" onclick="goBack()">กลับไปแก้ไข</button>
    </div>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const upload = document.getElementById('upload'), mainImg = document.getElementById('main-img');
  const brightness = document.getElementById('bright'), contrast = document.getElementById('contrast'), sharp = document.getElementById('sharp');
  const recBox = document.getElementById('recommendation-box'), recText = document.getElementById('recommendation-text');
  const filterDescBox = document.getElementById('filter-description'), filterDescText = document.getElementById('filter-description-text');

  let currentFilter = 'none', originalSrc = '', fileExtension = 'image/png';

  upload.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      fileExtension = file.type;
      const reader = new FileReader();
      reader.onload = (event) => {
        originalSrc = event.target.result;
        mainImg.src = originalSrc;
        document.getElementById('before-img').src = originalSrc;
        mainImg.classList.remove('hidden');
        document.getElementById('editor-ui').classList.remove('hidden');
        generateRecommendation();
        resetAll();
      }
      reader.readAsDataURL(file);
    }
  });

  function generateRecommendation() {
    recBox.style.display = "block";
    const tips = [
      "ตรวจพบว่าภาพของคุณอาจมี Noise หรือจุดรบกวนในส่วนเงา เราแนะนำให้ใช้ <b>Median Filter</b> เพราะฟิลเตอร์นี้จะแทนที่จุดสีที่ผิดปกติด้วยค่ากลาง ทำให้ภาพเนียนขึ้นโดยไม่ทำลายขอบวัตถุ",
      "หากภาพของคุณดูแบนหรือขาดความคมชัด แนะนำให้ใช้ <b>Wiener Style</b> ร่วมกับการเพิ่ม <b>Contrast (120%)</b> เพราะระบบจะช่วยดึงความต่างของแสงระดับ Micro-contrast ทำให้ภาพดูชัดเด้งออกมา",
      "หากนี่เป็นภาพบุคคลที่ต้องการความละมุน แนะนำให้เพิ่ม <b>Brightness</b> เล็กน้อยและใช้ <b>Gaussian</b> เพราะมันจะช่วยกระจายแสงให้ดูนุ่มนวล ลดความแข็งกระด้างของพิกเซล",
      "เพื่อความชัดสูงสุดสำหรับตัวอักษรหรือเอกสาร แนะนำให้ปรับ <b>Sharpness ไปที่ 40%</b> เพื่อให้ระบบดึงเส้นขอบ (Edges) ให้หนาและเข้มขึ้นกว่าปกติ"
    ];
    recText.innerHTML = tips[Math.floor(Math.random() * tips.length)];
  }

  window.setFilter = function(f) {
    currentFilter = f;
    filterDescBox.style.display = "block";
    let desc = "";
    switch(f) {
      case 'mean': desc = "<b>Mean:</b> เราใช้เพื่อลดความจัดจ้านของรายละเอียดที่มากเกินไป เหมาะสำหรับภาพที่ดู 'รก' สายตา ฟิลเตอร์นี้จะช่วยเฉลี่ยค่าสีให้ดูสบายตาขึ้น"; break;
      case 'median': desc = "<b>Median:</b> เราเลือกสิ่งนี้ให้คุณเพื่อ 'ทำความสะอาดภาพ' พิกเซลที่กระโดดผิดพวกจะถูกกำจัดออกไป เหมาะที่สุดสำหรับลด Noise โดยไม่ทำให้ภาพเบลอจนมัว"; break;
      case 'gaussian': desc = "<b>Gaussian:</b> เราใช้เพื่อสร้างความฟุ้งละมุน (Soft Focus) ช่วยกลบจุดบกพร่องเล็กๆ และทำให้การไล่เฉดสีในภาพดูเนียนนุ่มนวลกว่าเดิม"; break;
      case 'wiener': desc = "<b>Wiener:</b> เราใช้เพื่อ 'คืนความคมชัด' ฟิลเตอร์นี้จะวิเคราะห์ขอบวัตถุและเพิ่มความเข้มข้นในจุดที่ภาพดูมัว เพื่อให้ผลลัพธ์ออกมาดู Sharp และมีพลังที่สุด"; break;
    }
    filterDescText.innerHTML = desc;
    updateStyles();
  }

  function updateStyles() {
    const sharpVal = parseInt(sharp.value);
    // Logic ความคมชัดพิเศษ: เพิ่ม Contrast อัตโนมัติเมื่อ Sharpness สูงขึ้น
    let filterStr = `brightness(${brightness.value}%) contrast(${contrast.value}%) contrast(${100 + (sharpVal * 0.4)}%) saturate(1.05) `;

    if(currentFilter === 'mean') filterStr += ' blur(0.5px) opacity(0.9)';
    else if(currentFilter === 'median') filterStr += ' contrast(1.1)';
    else if(currentFilter === 'gaussian') filterStr += ' blur(1.2px)';
    else if(currentFilter === 'wiener') filterStr += ' contrast(1.3) saturate(1.1) brightness(1.05)';

    mainImg.style.filter = filterStr;
    document.getElementById('v-bright').innerText = brightness.value + '%';
    document.getElementById('v-contrast').innerText = contrast.value + '%';
    document.getElementById('v-sharp').innerText = sharp.value + '%';
  }

  window.resetAll = () => {
    brightness.value = 100; contrast.value = 100; sharp.value = 0;
    currentFilter = 'none'; filterDescBox.style.display = "none";
    updateStyles();
  }

  window.showFinal = function() {
    document.getElementById('editor-ui').classList.add('hidden');
    document.getElementById('result-ui').classList.remove('hidden');
    const canvas = document.getElementById('after-canvas'), ctx = canvas.getContext('2d'), img = new Image();
    img.src = mainImg.src;
    img.onload = function() {
      canvas.width = img.width; canvas.height = img.height;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.filter = mainImg.style.filter;
      ctx.drawImage(img, 0, 0);
    }
  }

  window.goBack = () => {
    document.getElementById('editor-ui').classList.remove('hidden');
    document.getElementById('result-ui').classList.add('hidden');
  }

  window.downloadImage = () => {
    const canvas = document.getElementById('after-canvas'), link = document.createElement('a');
    link.download = 'pro-enhanced.png';
    link.href = canvas.toDataURL(fileExtension, 1.0);
    link.click();
  }

  brightness.addEventListener('input', updateStyles);
  contrast.addEventListener('input', updateStyles);
  sharp.addEventListener('input', updateStyles);
});
</script>
</body>
</html>
