<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Influenca Style - Pro Image Enhancement</title>
  <style>
    :root {
      --primary-color: #8ca8a8;
      --dark-text: #ffffff;
      --dark-bg: #334747;
      --card-bg: #ffffff;
      --accent: #5d7575;
      --text-dark-card: #334747;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--dark-bg);
      color: var(--dark-text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-banner {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 40px 0;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 30px;
    }

    .header-banner h1 { font-size: 2.5rem; margin: 0; font-weight: 800; }

    .container {
      max-width: 1100px;
      width: 90%;
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 50px;
    }

    .upload-zone {
      background: rgba(255, 255, 255, 0.1);
      border: 2px dashed var(--primary-color);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: center;
    }

    /* Recommendation Box */
    #recommendation-box {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 25px;
      text-align: left;
      display: none;
      animation: fadeIn 0.5s ease;
      border-left: 6px solid #5d7575;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .image-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      color: var(--text-dark-card);
    }

    .image-card label {
      display: block;
      padding: 8px;
      background: #f0f3f3;
      font-weight: bold;
      font-size: 0.85rem;
    }

    img, canvas { width: 100%; display: block; }

    .editor-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .slider-group { margin-bottom: 15px; }
    .slider-group label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    .button-group {
      grid-column: span 2;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    button {
      padding: 10px 20px;
      border-radius: 25px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-filter { background: rgba(255, 255, 255, 0.1); color: white; }
    .btn-filter:hover { background: var(--primary-color); }
    .btn-main { background: var(--primary-color); color: white; }

    #filter-description {
      grid-column: span 2;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
      font-size: 0.9rem;
      border: 1px solid var(--primary-color);
    }

    .hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="header-banner">
  <h1>Image Enhance Pro</h1>
  <p>เครื่องมือปรับแต่งภาพอัจฉริยะ พร้อมระบบแนะนำการปรับแสงและสี</p>
</div>

<div class="container">
  
  <div class="upload-zone">
    <input type="file" id="upload" accept="image/*">
    <p>เลือกไฟล์ภาพเพื่อรับคำแนะนำการปรับแต่ง</p>
  </div>

  <div id="recommendation-box">
    <strong>💡 ✨ คำแนะนำจากผู้เชี่ยวชาญ:</strong>
    <div id="recommendation-text" style="margin-top: 8px; line-height: 1.5;"></div>
  </div>

  <div class="preview-grid">
    <div class="image-card"><label>Original</label><img id="before-img"></div>
    <div class="image-card"><label>Live Preview</label><img id="main-img" class="hidden"></div>
  </div>

  <div id="editor-ui" class="hidden">
    <div class="editor-section">
      <div class="slider-group">
        <label>Brightness <span id="v-bright">100%</span></label>
        <input type="range" id="bright" min="0" max="200" value="100">
      </div>
      <div class="slider-group">
        <label>Contrast <span id="v-contrast">100%</span></label>
        <input type="range" id="contrast" min="0" max="200" value="100">
      </div>
      <div class="slider-group">
        <label>Smooth <span id="v-smooth">0px</span></label>
        <input type="range" id="smooth" min="0" max="10" value="0">
      </div>
      <div class="slider-group">
        <label>Sharpness <span id="v-sharp">0%</span></label>
        <input type="range" id="sharp" min="0" max="100" value="0">
      </div>

      <div class="button-group">
        <button class="btn-filter" onclick="setFilter('mean')">Mean (นุ่มนวล)</button>
        <button class="btn-filter" onclick="setFilter('median')">Median (ลดนอยซ์)</button>
        <button class="btn-filter" onclick="setFilter('gaussian')">Gaussian (ฟุ้งสวย)</button>
        <button class="btn-filter" onclick="setFilter('wiener')">Wiener (คมชัดสูง)</button>
        <button class="btn-filter" style="margin-left: auto;" onclick="resetAll()">รีเซ็ต</button>
        <button class="btn-main" onclick="showFinal()">บันทึกรูปภาพ</button>
      </div>

      <div id="filter-description">
        <strong>🔍 วิเคราะห์ฟิลเตอร์:</strong>
        <p id="filter-description-text" style="margin-top: 5px;"></p>
      </div>
    </div>
  </div>

  <div id="result-ui" class="hidden">
    <h3>✅ ปรับแต่งเรียบร้อย</h3>
    <canvas id="after-canvas" style="border-radius: 12px; margin-bottom: 20px;"></canvas>
    <div class="button-group" style="justify-content: center; border: none;">
      <button class="btn-main" onclick="downloadImage()">ดาวน์โหลด PNG</button>
      <button class="btn-filter" onclick="goBack()">กลับไปแก้ไข</button>
    </div>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const upload = document.getElementById('upload'), mainImg = document.getElementById('main-img');
  const brightness = document.getElementById('bright'), contrast = document.getElementById('contrast');
  const smooth = document.getElementById('smooth'), sharp = document.getElementById('sharp');
  const recBox = document.getElementById('recommendation-box'), recText = document.getElementById('recommendation-text');
  const filterDescBox = document.getElementById('filter-description'), filterDescText = document.getElementById('filter-description-text');

  let currentFilter = 'none', fileExtension = 'image/png';

  upload.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      fileExtension = file.type;
      const reader = new FileReader();
      reader.onload = function(event) {
        mainImg.src = event.target.result;
        document.getElementById('before-img').src = event.target.result;
        mainImg.classList.remove('hidden');
        document.getElementById('editor-ui').classList.remove('hidden');
        generateRecommendation();
        resetAll();
      }
      reader.readAsDataURL(file);
    }
  });

  function generateRecommendation() {
    recBox.style.display = "block";
    const tips = [
      "<b>เทคนิคพื้นฐาน:</b> หากคุณเพิ่ม Contrast ให้ลองเพิ่ม Brightness ตามเล็กน้อย (+10%) เพื่อไม่ให้ส่วนเงาเข้มจนเกินไปครับ",
      "<b>สำหรับภาพย้อนแสง:</b> ลองปรับ Brightness ไปที่ 120% และ Contrast ที่ 110% จะช่วยให้ภาพดูสดใสขึ้นทันที",
      "<b>ต้องการความคมชัด:</b> เพิ่ม Contrast ให้สูง (130%) และใช้ Wiener Filter จะช่วยดึงรายละเอียดวัตถุให้เด่นชัด",
      "<b>ภาพนุ่มนวล (Portrait):</b> ลด Contrast ลงเล็กน้อย (90%) และเพิ่ม Smooth (2px) จะทำให้ผิวดูละมุนขึ้น"
    ];
    recText.innerHTML = tips[Math.floor(Math.random() * tips.length)];
  }

  function setFilter(f) {
    currentFilter = f;
    filterDescBox.style.display = "block";
    
    // ปรับค่าแสงเบื้องต้นตามฟิลเตอร์ที่เลือก (Smart adjustment)
    if(f === 'median') { 
        contrast.value = 115; // Median มักทำให้ภาพแบน จึงดึง Contrast ช่วย
        filterDescText.innerText = "Median: ช่วยลบจุดสีรบกวน (Noise) เหมาะกับภาพที่ถ่ายในที่มืด เราเพิ่ม Contrast ให้คุณอัตโนมัติเพื่อให้ภาพไม่ดูแบนเกินไป";
    } else if(f === 'wiener') {
        brightness.value = 110; 
        filterDescText.innerText = "Wiener Style: เน้นความคมชัดแบบคลาสสิก เหมาะกับภาพวิวหรือสถาปัตยกรรม เราดึง Brightness ขึ้นเพื่อให้เห็นมิติชัดเจน";
    } else if(f === 'mean') {
        filterDescText.innerText = "Mean: ลดรายละเอียดส่วนเกินเพื่อให้ภาพดูเรียบง่าย นุ่มนวลขึ้น";
    } else if(f === 'gaussian') {
        filterDescText.innerText = "Gaussian: สร้างเอฟเฟกต์ภาพฟุ้งกระจายแบบนุ่มนวล เหมาะสำหรับทำพื้นหลังเบลอ";
    }
    updateStyles();
  }

  function updateStyles() {
    let filterStr = `brightness(${brightness.value}%) contrast(${contrast.value}%) blur(${smooth.value}px) contrast(${100 + parseInt(sharp.value)}%) `;
    
    if(currentFilter === 'mean') filterStr += ' blur(0.6px) opacity(0.9)';
    else if(currentFilter === 'median') filterStr += ' saturate(0.9) contrast(1.1)';
    else if(currentFilter === 'gaussian') filterStr += ' blur(1.5px)';
    else if(currentFilter === 'wiener') filterStr += ' contrast(1.4) saturate(0)';

    mainImg.style.filter = filterStr;
    document.getElementById('v-bright').innerText = brightness.value + '%';
    document.getElementById('v-contrast').innerText = contrast.value + '%';
    document.getElementById('v-smooth').innerText = smooth.value + 'px';
    document.getElementById('v-sharp').innerText = sharp.value + '%';
  }

  brightness.addEventListener('input', updateStyles);
  contrast.addEventListener('input', updateStyles);
  smooth.addEventListener('input', updateStyles);
  sharp.addEventListener('input', updateStyles);

  window.setFilter = setFilter;
  window.resetAll = function() {
    brightness.value = 100; contrast.value = 100; smooth.value = 0; sharp.value = 0;
    currentFilter = 'none'; filterDescBox.style.display = "none";
    updateStyles();
  };

  window.showFinal = function() {
    document.getElementById('editor-ui').classList.add('hidden');
    document.getElementById('result-ui').classList.remove('hidden');
    const canvas = document.getElementById('after-canvas'), ctx = canvas.getContext('2d'), img = new Image();
    img.src = mainImg.src;
    img.onload = function() {
      canvas.width = img.width; canvas.height = img.height;
      ctx.filter = mainImg.style.filter;
      ctx.drawImage(img, 0, 0);
    }
  };

  window.goBack = function() {
    document.getElementById('editor-ui').classList.remove('hidden');
    document.getElementById('result-ui').classList.add('hidden');
  };

  window.downloadImage = function() {
    const canvas = document.getElementById('after-canvas'), link = document.createElement('a');
    link.download = 'enhanced.png'; link.href = canvas.toDataURL(fileExtension); link.click();
  };
});
</script>
</body>
</html>
