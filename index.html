<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Artifact Fixer</title>
  <style>
    /* --- โทนสีตามภาพ Influenca Template --- */
    :root {
      --primary: #789999;       /* สีเขียวตุ่น (Sage Green) */
      --primary-dark: #587979;  /* เขียวเข้ม */
      --accent-dark: #222222;   /* ดำ/เทาเข้ม สำหรับตัวหนังสือและปุ่ม */
      --bg-color: #f2f6f6;      /* สีพื้นหลังรวม (เทาอมเขียวอ่อนๆ) */
      --card-bg: #ffffff;
      --danger: #e74c3c;
      --success: #27ae60;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--accent-dark);
      margin: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }

    /* --- Header (สไตล์ Contact Us ในภาพเรฟ) --- */
    .header-banner {
      width: 100%;
      background-color: transparent;
      padding: 60px 20px 40px 20px;
      text-align: center;
    }

    /* สัญลักษณ์ลูกศรตกแต่ง (มุมซ้ายบน) */
    .header-banner::before {
      content: '>>>>>>';
      position: absolute;
      top: 40px; left: 10%;
      font-size: 2rem;
      color: rgba(118, 153, 153, 0.3);
      letter-spacing: -2px;
    }
    
    /* สัญลักษณ์ลูกศรตกแต่ง (มุมขวาล่าง) */
    .header-banner::after {
      content: '>>>>>>';
      position: absolute;
      top: 150px; right: 10%;
      font-size: 2rem;
      color: rgba(118, 153, 153, 0.3);
      letter-spacing: -2px;
    }

    .header-banner h1 {
      font-size: 4rem;
      margin: 0;
      font-weight: 900;
      color: var(--accent-dark);
      letter-spacing: -1px;
    }

    /* เส้นหยักใต้ตัวหนังสือ */
    .header-banner .wave-line {
      font-size: 1.5rem;
      color: var(--primary);
      letter-spacing: -2px;
      margin: 5px 0 15px 0;
      display: block;
    }

    .header-banner p {
      color: #666;
      max-width: 550px;
      margin: 0 auto;
      line-height: 1.6;
      font-size: 1rem;
    }

    /* --- Container หลัก --- */
    .container {
      max-width: 1000px; width: 90%;
      margin-bottom: 60px;
      flex: 1;
    }

    /* --- Upload Zone (สไตล์กล่อง Form ในภาพเรฟ) --- */
    .upload-zone {
      background-color: #dbe4e4; /* สีเทาอมเขียวอ่อนๆ */
      padding: 40px;
      border-radius: 20px;
      margin-bottom: 40px;
      text-align: center;
      transition: 0.3s;
    }

    .upload-zone input[type="file"] {
      background: var(--white);
      padding: 15px 25px;
      border-radius: 30px;
      color: var(--accent-dark);
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    /* --- Recommendation Box (สไตล์กล่อง Our Newsletters สีเขียว) --- */
    #recommendation-box {
      background-color: var(--primary);
      color: white;
      padding: 40px;
      border-radius: 20px;
      margin-bottom: 40px;
      display: none;
      animation: fadeIn 0.5s ease;
      box-shadow: 0 15px 30px rgba(118, 153, 153, 0.3);
    }

    #recommendation-box h3 {
      margin: 0 0 15px 0;
      font-size: 1.5rem;
      font-weight: 800;
    }

    #recommendation-box p {
      margin: 0 0 15px 0;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .status-tag { 
      display: inline-block; padding: 5px 15px; 
      border-radius: 20px; font-weight: bold; font-size: 0.85rem; margin-bottom: 15px; 
      background: var(--white);
    }
    .text-danger { color: var(--danger); }
    .text-success { color: var(--success); }
    .text-info { color: var(--primary-dark); }

    /* --- Image Preview Area --- */
    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
    .image-card { 
      background: var(--card-bg); 
      border-radius: 20px; 
      overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
    }
    .image-card label { 
      display: block; padding: 15px; background: var(--white); 
      color: var(--accent-dark); font-weight: 800; font-size: 0.9rem; 
      text-align: center; border-bottom: 1px solid #f0f0f0;
    }
    img, canvas { width: 100%; display: block; image-rendering: -webkit-optimize-contrast; background: #111;}

    /* --- Editor Controls --- */
    .editor-section { 
      background: var(--card-bg);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    
    .slider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 20px; }
    .slider-group label { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 12px; font-size: 0.95rem; color: #444; }
    .slider-group span { color: var(--primary-dark); }
    input[type="range"] { width: 100%; height: 8px; border-radius: 5px; accent-color: var(--primary); cursor: pointer; background: #e0e6e6; outline: none; }

    /* --- Buttons --- */
    .button-group { 
      display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; 
      margin-top: 30px; padding-top: 30px; border-top: 1px solid #f0f0f0; 
    }
    
    button { 
      padding: 15px 35px; border-radius: 30px; border: none; 
      font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: 0.2s; 
    }
    
    /* ปุ่มฟิลเตอร์สไตล์กล่องเทา */
    .btn-filter { background: var(--input-bg); color: var(--accent-dark); }
    .btn-filter:hover { background: var(--primary); color: white; transform: translateY(-2px); }
    
    /* ปุ่มหลักสีดำ */
    .btn-main { background: var(--accent-dark); color: white; }
    .btn-main:hover { background: #000; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

    .btn-reset { background: transparent; color: #888; border: 2px solid #ccc; }
    .btn-reset:hover { background: #eee; }

    #filter-description {
      background: var(--bg-color); padding: 20px; border-radius: 12px;
      margin-top: 25px; display: none; text-align: left; 
    }

    .hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    
    @media (max-width: 768px) { .preview-grid, .slider-grid { grid-template-columns: 1fr; } }

    /* --- Footer (ตามภาพเรฟ) --- */
    .footer {
      width: 100%; background: #5c7b7b; /* สีเขียวเข้มแบบในภาพ */
      padding: 60px 20px; text-align: center; color: white;
    }
    .footer h2 { margin: 0 0 10px 0; font-size: 1.8rem; font-weight: 800; }
  </style>
</head>
<body>

<div class="header-banner">
  <h1>Image Diagnostics</h1>
  <span class="wave-line">〰〰〰</span>
  <p>ระบบวิเคราะห์และปรับแต่งภาพถ่ายทางการแพทย์อัตโนมัติ<br>อัปโหลดภาพเพื่อเริ่มต้นการวิเคราะห์โครงสร้างพิกเซล</p>
</div>

<div class="container">
  
  <div class="upload-zone">
    <input type="file" id="upload" accept="image/*">
  </div>

  <div id="recommendation-box">
    <h3>Clinical Advice & Diagnostic Plan</h3>
    <div id="recommendation-content">
      กำลังวิเคราะห์พิกเซลภาพ...
    </div>
  </div>

  <div class="preview-grid">
    <div class="image-card"><label>ORIGINAL SCAN</label><img id="before-img"></div>
    <div class="image-card"><label>DIAGNOSTIC VIEW</label><img id="main-img" class="hidden"></div>
  </div>

  <div id="editor-ui" class="hidden">
    <div class="editor-section">
      <div class="slider-grid">
        <div class="slider-group">
          <label>Brightness (Level) <span id="v-bright">100%</span></label>
          <input type="range" id="bright" min="0" max="250" value="100">
        </div>
        <div class="slider-group">
          <label>Contrast (Width) <span id="v-contrast">100%</span></label>
          <input type="range" id="contrast" min="0" max="250" value="100">
        </div>
        <div class="slider-group">
          <label>Smoothing (Tissue Blend) <span id="v-smooth">0px</span></label>
          <input type="range" id="smooth" min="0" max="10" value="0">
        </div>
        <div class="slider-group">
          <label>Sharpness (Edge Definition) <span id="v-sharp">0%</span></label>
          <input type="range" id="sharp" min="0" max="100" value="0">
        </div>
      </div>

      <div class="button-group">
        <button class="btn-filter" id="btn-median" onclick="setFilter('median')">Denoise (Median)</button>
        <button class="btn-filter" id="btn-wiener" onclick="setFilter('wiener')">Edge Enhance (Wiener)</button>
        <button class="btn-filter" id="btn-mean" onclick="setFilter('mean')">Tissue Smooth (Mean)</button>
        <button class="btn-reset" onclick="resetAll()">Reset</button>
      </div>
      
      <div class="button-group" style="border-top: none; padding-top: 0; margin-top: 15px;">
        <button class="btn-main" onclick="showFinal()">GENERATE FINAL IMAGE</button>
      </div>

      <div id="filter-description">
        <strong style="color: var(--accent-dark);">🔍 หลักการประมวลผล:</strong>
        <p id="filter-description-text" style="margin-top: 8px; color: #666; font-size: 0.95rem; line-height: 1.6; margin-bottom: 0;"></p>
      </div>
    </div>
  </div>

  <div id="result-ui" class="hidden">
    <canvas id="after-canvas" style="border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 30px;"></canvas>
    <div class="button-group" style="border: none;">
      <button class="btn-main" onclick="downloadImage()">SAVE DIAGNOSTIC IMAGE</button>
      <button class="btn-filter" onclick="goBack()">RETURN TO EDITOR</button>
    </div>
  </div>
</div>

<div class="footer">
  <h2>Influenca Medical</h2>
  <p style="font-size: 0.9rem; opacity: 0.8; margin: 0;">© 2024 Developed for Clinical Image Enhancement.</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const upload = document.getElementById('upload'), mainImg = document.getElementById('main-img');
  const brightness = document.getElementById('bright'), contrast = document.getElementById('contrast');
  const sharp = document.getElementById('sharp'), smooth = document.getElementById('smooth');
  const recBox = document.getElementById('recommendation-box'), recContent = document.getElementById('recommendation-content');
  const filterDescBox = document.getElementById('filter-description'), filterDescText = document.getElementById('filter-description-text');

  let currentFilter = 'none', originalSrc = '', fileExtension = 'image/png';

  // 🧠 ฟังก์ชันวิเคราะห์ภาพ (ประเมินว่าภาพปกติ หรือมี Artifact)
  function analyzeDiagnosticImage() {
    recBox.style.display = "block";
    
    const img = new Image();
    img.src = mainImg.src;
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 100; canvas.height = 100;
      ctx.drawImage(img, 0, 0, 100, 100);
      
      const pixelData = ctx.getImageData(0, 0, 100,
